<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>괴산명덕초등학교 온라인 전시관</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div style="font-family:system-ui,sans-serif;padding:40px;text-align:center">전시관을 불러오는 중입니다…</div><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/STELLA-YOUNNG/goesan-art-gallery/dbbf56fd48970374decdd4cea516ffa74f739fc1/index.html',{cache:'no-store'});const s=await r.text();const m=s.match(/const b=\"([^\"]+)\"/);if(!m)throw new Error('data not found');const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));const html=new TextDecoder().decode(pako.ungzip(bin));document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="font-family:system-ui,sans-serif;padding:40px;text-align:center"><h2>전시관을 불러오지 못했습니다.</h2><p>페이지를 새로고침해 주세요.</p></div>';console.error(e)}})()</script></body></html>
